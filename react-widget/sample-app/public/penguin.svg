<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Penguin body -->
  <ellipse cx="100" cy="120" rx="60" ry="80" fill="#000000"/>
  
  <!-- Penguin belly -->
  <ellipse cx="100" cy="130" rx="40" ry="60" fill="#FFFFFF"/>
  
  <!-- Left wing -->
  <ellipse cx="50" cy="120" rx="15" ry="50" fill="#000000"/>
  
  <!-- Right wing -->
  <ellipse cx="150" cy="120" rx="15" ry="50" fill="#000000"/>
  
  <!-- Head -->
  <circle cx="100" cy="60" r="35" fill="#000000"/>
  
  <!-- Left eye white -->
  <ellipse cx="90" cy="55" rx="12" ry="15" fill="#FFFFFF"/>
  
  <!-- Right eye white -->
  <ellipse cx="110" cy="55" rx="12" ry="15" fill="#FFFFFF"/>
  
  <!-- Left eye pupil -->
  <circle cx="92" cy="58" r="6" fill="#000000"/>
  
  <!-- Right eye pupil -->
  <circle cx="108" cy="58" r="6" fill="#000000"/>
  
  <!-- Beak -->
  <ellipse cx="100" cy="70" rx="10" ry="8" fill="#FFA500"/>
  
  <!-- Left foot -->
  <ellipse cx="80" cy="190" rx="18" ry="12" fill="#FFA500"/>
  
  <!-- Right foot -->
  <ellipse cx="120" cy="190" rx="18" ry="12" fill="#FFA500"/>
</svg>
